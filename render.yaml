services:
  - type: web
    name: pakhi-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pakhi-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INVENTORY_ENCRYPTION_KEY
        sync: false
      - key: MOBILE_APP_TOKEN
        sync: false
      - key: WHATSAPP_NUMBER
        value: "9296271001"
      - key: SITE_NAME
        value: "PAKHI"
      - key: UPI_VPA
        sync: false
      - key: UPI_NAME
        value: "PAKHI"

databases:
  - name: pakhi-db
    plan: free
